interface:
  display_name: "Проектирование тест-кейса"
  short_description: "Проектирует один обычный или параметризованный кейс"
  default_prompt: "Используй $design-test-case, чтобы спроектировать одну проверку размера тестового метода в формате test-case-specification-format, по требованию, сообщению об ошибке или описанию поведения. Выбери SUT, вид, форму и цель по правилам скилла; для parameterized используй Scenario Outline с Examples. Только проектирование: не кодируй и не анонсируй кодирование."
